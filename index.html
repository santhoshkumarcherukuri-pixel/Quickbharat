<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBharat - Super App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; transition: 0.3s ease; }
        
        .phone-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; overflow-y: auto; position: relative; transition: 0.5s ease; }
        
        /* Dark Mode Theme */
        .dark-mode { background: #121212 !important; color: #ffffff; }
        .dark-mode .app-card, .dark-mode .news-card { background: #1e1e1e !important; color: white; box-shadow: 0 2px 5px rgba(255,255,255,0.05); }
        .dark-mode .app-name, .dark-mode .news-title { color: #ddd !important; }
        .dark-mode .section-heading { color: #fff; border-left-color: #ff4b2b; }
        .dark-mode .search-container { background: #2a2a2a; color: white; }
        .dark-mode .search-bar { background: transparent; color: white; }
        .dark-mode .smart-alert { background: #332701; color: #ffda6a; }
        .dark-mode .lang-select { background: #2a2a2a; color: white; border-color: #555; }
        .dark-mode .blood-box { background: #2c1515; border-color: #ff4b4b; color: #ff9999; }

        /* Power Saving Grayscale Effect */
        .power-saving { filter: grayscale(80%) brightness(0.85); }
        
        .app-header { background: linear-gradient(135deg, #ff9933 0%, #138808 100%); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; transition: 0.5s ease; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .app-title { font-size: 16px; font-weight: bold; }
        
        /* Live Clock & Status Box */
        .status-box { display: flex; align-items: center; gap: 5px; }
        .live-clock { font-size: 11px; background: rgba(0,0,0,0.3); padding: 4px 6px; border-radius: 10px; font-weight: 500; }
        
        .controls-box { display: flex; align-items: center; gap: 5px; margin-top: 5px; justify-content: flex-end; }
        .theme-btn, .lang-select { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 4px 8px; border-radius: 10px; outline: none; font-size: 11px; cursor: pointer; }
        .lang-select option { color: black; background: white; }
        .battery-status { font-size: 11px; background: rgba(0,0,0,0.3); padding: 4px 6px; border-radius: 10px; }
        
        .search-container { display: flex; align-items: center; background: white; border-radius: 20px; padding: 5px 12px; margin-top: 8px; }
        .search-bar { width: 100%; border: none; outline: none; padding: 5px; font-size: 14px; color: #333; }
        .search-bar::placeholder { color: #888; }
        .mic-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #138808; padding-left: 5px; }
        
        .smart-alert { background: #fff3cd; color: #856404; padding: 10px; margin: 15px; border-radius: 8px; font-size: 12px; text-align: center; font-weight: bold; }

        /* Blood Emergency Box */
        .blood-box { background: #fff0f0; border: 1px solid #ffcccc; color: #cc0000; padding: 12px; margin: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .blood-info { font-size: 12px; font-weight: bold; }
        .blood-btn { background: #ff4b4b; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .blood-btn:hover { background: #e03e3e; }

        .main-section { padding: 15px; }
        .section-heading { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #333; border-left: 4px solid #138808; padding-left: 6px; }
        
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .app-card { background: #f9f9f9; padding: 12px 5px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .app-card:hover { transform: scale(1.05); }
        .app-icon { font-size: 26px; margin-bottom: 6px; }
        .app-name { font-size: 11px; color: #444; font-weight: 500; }

        /* News Section Styling */
        .news-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .news-card { background: #f9f9f9; padding: 12px; border-radius: 10px; border-left: 3px solid #ff9933; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .news-card:hover { transform: translateY(-2px); }
        .news-title { font-size: 13px; font-weight: bold; color: #333; margin-bottom: 4px; }
        .news-time { font-size: 10px; color: #777; }
    </style>
</head>
<body id="pageBody">
    <div class="phone-container" id="phoneContainer">
        <div class="app-header" id="appHeader">
            <div class="top-bar">
                <div class="app-title" id="lblTitle">QuickBharat</div>
                <div class="status-box">
                    <div class="live-clock" id="liveClock">00:00:00 AM</div>
                    <div class="battery-status" id="batteryText">Smart</div>
                </div>
            </div>
            <div class="controls-box">
                <button class="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙/☀️</button>
                <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                    <option value="en" selected>English</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="mr">मराठी (Marathi)</option>
                    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                </select>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Type or speak app name..." onkeyup="filterApps()">
                <button class="mic-btn" onclick="startVoiceSearch()" title="Voice Search">🎤</button>
            </div>
        </div>

        <div class="smart-alert" id="smartAlert">System Status: All systems running smoothly</div>

        <!-- Blood Emergency Widget -->
        <div class="blood-box" id="bloodBox">
            <div class="blood-info" id="lblBloodText">🩸 Emergency Blood Support & Nearby Hospitals</div>
            <button class="blood-btn" id="lblBloodBtn" onclick="openBloodHelp()">Find Help</button>
        </div>

        <div class="main-section">
            <div class="section-heading" id="lblAppsHeading">All Phone Apps</div>
            <div class="app-grid" id="appGrid">
                <div class="app-card" onclick="openApp('WhatsApp')"><div class="app-icon">💬</div><div class="app-name">WhatsApp</div></div>
                <div class="app-card" onclick="openApp('YouTube')"><div class="app-icon">▶️</div><div class="app-name">YouTube</div></div>
                <div class="app-card" onclick="openApp('Instagram')"><div class="app-icon">📸</div><div class="app-name">Instagram</div></div>
                <div class="app-card" onclick="openApp('PhonePe')"><div class="app-icon">💸</div><div class="app-name">PhonePe</div></div>
                
                <div class="app-card" onclick="openApp('Google Pay')"><div class="app-icon">📱</div><div class="app-name">GPay</div></div>
                <div class="app-card" onclick="openApp('Amazon')"><div class="app-icon">📦</div><div class="app-name">Amazon</div></div>
                <div class="app-card" onclick="openApp('Flipkart')"><div class="app-icon">🛍️</div><div class="app-name">Flipkart</div></div>
                <div class="app-card" onclick="openApp('Facebook')"><div class="app-icon">👥</div><div class="app-name">Facebook</div></div>

                <div class="app-card" onclick="openApp('Gmail')"><div class="app-icon">✉️</div><div class="app-name">Gmail</div></div>
                <div class="app-card" onclick="openApp('Chrome')"><div class="app-icon">🌐</div><div class="app-name">Chrome</div></div>
                <div class="app-card" onclick="openApp('Telegram')"><div class="app-icon">✈️</div><div class="app-name">Telegram</div></div>
                <div class="app-card" onclick="openApp('Spotify')"><div class="app-icon">🎵</div><div class="app-name">Spotify</div></div>
            </div>

            <!-- Live News Section -->
            <div class="section-heading" id="lblNewsHeading">Live News Updates</div>
            <div class="news-container" id="newsContainer">
                <!-- Dynamic News Items will load here based on language -->
            </div>
        </div>
    </div>

    <script>
        // News Data for Different Languages
        const newsData = {
            en: [
                { title: "QuickBharat Super App launched officially with multi-language support.", time: "10 mins ago" },
                { title: "Major tech advancements seen across India's digital ecosystem.", time: "1 hour ago" },
                { title: "Stock markets open with positive momentum today.", time: "2 hours ago" }
            ],
            te: [
                { title: "క్విక్ భారత్ సూపర్ యాప్ బహుభాషా సపోర్ట్‌తో అధికారికంగా ప్రారంభించబడింది.", time: "10 నిమిషాల క్రితం" },
                { title: "భారతదేశ డిజిటల్ రంగంలో వేగవంతమైన సాంకేతిక మార్పులు.", time: "1 గంట క్రితం" },
                { title: "ఈరోజు స్టాక్ మార్కెట్లు లాభాలతో ప్రారంభమయ్యాయి.", time: "2 గంటల క్రితం" }
            ],
            hi: [
                { title: "मल्टी-लैंग्वेज सपोर्ट के साथ क्विक भारत सुपर ऐप आधिकारिक तौर पर लॉन्च हुआ।", time: "10 मिनट पहले" },
                { title: "भारत के डिजिटल इकोसिस्टम में बड़े तकनीकी बदलाव देखे गए।", time: "1 घंटा पहले" },
                { title: "आज शेयर बाजार हरे निशान के साथ खुले।", time: "2 घंटे पहले" }
            ],
            ta: [
                { title: "குவிக் பாரத் சூப்பர் ஆப் பல மொழி ஆதரவுடன் அதிகாரப்பூர்வமாக தொடங்கப்பட்டது.", time: "10 நிமிடங்களுக்கு முன்பு" },
                { title: "இந்தியாவின் டிஜிட்டல் சுற்றுச்சூழல் அமைப்பில் பெரிய தொழில்நுட்ப முன்னேற்றங்கள்.", time: "1 மணி நேரத்திற்கு முன்பு" }
            ],
            kn: [
                { title: "ಕ್ವಿಕ್ ಭಾರತ್ ಸೂಪರ್ ಅಪ್ಲಿಕೇಶನ್ ಬಹುಭಾಷಾ ಬೆಂಬಲದೊಂದಿಗೆ ಅಧಿಕೃತವಾಗಿ ಬಿಡುಗಡೆಯಾಗಿದೆ.", time: "10 ನಿಮಿಷಗಳ ಹಿಂದೆ" },
                { title: "ಭಾರತದ ಡಿಜಿಟಲ್ ವ್ಯವಸ್ಥೆಯಲ್ಲಿ ಪ್ರಮುಖ ತಂತ್ರಜ್ಞಾನ ಬದಲಾವಣೆಗಳು.", time: "1 ಗಂಟೆಯ ಹಿಂದೆ" }
            ]
        };

        const translations = {
            en: { title: "QuickBharat", searchPlaceholder: "Type or speak app name...", alertNormal: "System Status: All systems running smoothly", appsHeading: "All Phone Apps", newsHeading: "Live News Updates", launch: "Launching ", bloodText: "🩸 Emergency Blood Support & Nearby Hospitals", bloodBtn: "Find Help", bloodAlert: "Opening Blood Bank & Nearby Hospitals Emergency Directory..." },
            te: { title: "క్విక్ భారత్", searchPlaceholder: "యాప్ పేరు టైప్ చేయండి లేదా మాట్లాడండి...", alertNormal: "సిస్టమ్ స్థితి: అన్నీ సక్రమంగా పనిచేస్తున్నాయి", appsHeading: "అన్ని ఫోన్ యాప్స్", newsHeading: "తాజా వార్తలు (Live News)", launch: "లాంచ్ అవుతోంది: ", bloodText: "🩸 అత్యవసర రక్త సహాయం & ఆసుపత్రులు", bloodBtn: "సహాయం పొందండి", bloodAlert: "బ్లడ్ బ్యాంక్ & అత్యవసర ఆసుపత్రుల వివరాలు తెరవబడుతున్నాయి..." },
            hi: { title: "क्विक भारत", searchPlaceholder: "ऐप का नाम टाइप करें या बोलें...", alertNormal: "सिस्टम स्थिति: सभी सिस्टम ठीक से काम कर रहे हैं", appsHeading: "सभी फोन ऐप्स", newsHeading: "ताज़ा खबरें (Live News)", launch: "लॉन्च हो रहा है: ", bloodText: "🩸 आपातकालीन रक्त सहायता और अस्पताल", bloodBtn: "सहायता पाएं", bloodAlert: "ब्लड बैंक और नजदीकी अस्पतालों की आपातकालीन निर्देशिका खुल रही है..." },
            ta: { title: "விக் பாரத்", searchPlaceholder: "செயலி பெயரை உள்ளிடவும் அல்லது பேசவும்...", alertNormal: "அமைப்பு நிலை: அனைத்து அமைப்புகளும் சீராக இயங்குகின்றன", appsHeading: "அனைத்து தொலைபேசி செயலிகள்", newsHeading: "நேரலைச் செய்திகள் (Live News)", launch: "தொடங்குகிறது: ", bloodText: "🩸 அவசர இரத்த உதவி & மருத்துவமனைகள்", bloodBtn: "உதவி பெறு", bloodAlert: "இரத்த வங்கி மற்றும் அருகிலுள்ள மருத்துவமனைகள் அடைவு திறக்கப்படுகிறது..." },
            kn: { title: "ಕ್ವಿಕ್ ಭಾರತ್", searchPlaceholder: "ಅಪ್ಲಿಕೇಶನ್ ಹೆಸರನ್ನು ಟೈಪ್ ಮಾಡಿ ಅಥವಾ ಮಾತನಾಡಿ...", alertNormal: "ಸಿಸ್ಟಮ್ ಸ್ಥಿತಿ: ಎಲ್ಲಾ ವ್ಯವಸ್ಥೆಗಳು ಸರಾಗವಾಗಿ ನಡೆಯುತ್ತಿವೆ", appsHeading: "ಎಲ್ಲಾ ಫೋನ್ ಅಪ್ಲಿಕೇಶನ್‌ಗಳು", newsHeading: "ನೇರ ಸುದ್ದಿ (Live News)", launch: "ಪ್ರಾರಂಭಿಸಲಾಗುತ್ತಿದೆ: ", bloodText: "🩸 ತುರ್ತು ರಕ್ತ ಸಹಾಯ ಮತ್ತು ಆಸ್ಪತ್ರೆಗಳು", bloodBtn: "ಸಹಾಯ ಪಡೆಯಿರಿ", bloodAlert: "ಬ್ಲಡ್ ಬ್ಯಾಂಕ್ ಮತ್ತು ಹತ್ತಿರದ ಆಸ್ಪತ್ರೆಗಳ ತುರ್ತು ಡೈರೆಕ್ಟರಿ ತೆರೆಯಲಾಗುತ್ತಿದೆ..." }
        };

        let currentLang = 'en';

        function loadNews() {
            let container = document.getElementById('newsContainer');
            container.innerHTML = "";
            let currentNews = newsData[currentLang] || newsData['en'];

            currentNews.forEach(item => {
                let card = document.createElement('div');
                card.className = 'news-card';
                card.onclick = () => alert("Reading full news: " + item.title);
                card.innerHTML = `<div class="news-title">${item.title}</div><div class="news-time">🕒 ${item.time}</div>`;
                container.appendChild(card);
            });
        }

        function changeLanguage() {
            let select = document.getElementById('langSelect');
            currentLang = select.value;
            let t = translations[currentLang] || translations['en'];

            document.getElementById('lblTitle').innerText = t.title;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('lblAppsHeading').innerText = t.appsHeading;
            document.getElementById('lblNewsHeading').innerText = t.newsHeading;
            document.getElementById('smartAlert').innerText = t.alertNormal;
            document.getElementById('lblBloodText').innerText = t.bloodText;
            document.getElementById('lblBloodBtn').innerText = t.bloodBtn;

            loadNews();
        }

        function openBloodHelp() {
            let t = translations[currentLang] || translations['en'];
            alert(t.bloodAlert);
        }

        // Live Clock with Seconds Function
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            let timeString = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
            document.getElementById('liveClock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openApp(appName) {
            let t = translations[currentLang] || translations['en'];
            alert(t.launch + appName);
        }

        function toggleTheme() {
            let container = document.getElementById('phoneContainer');
            container.classList.toggle('dark-mode');
        }

        function filterApps() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('app-card');
            
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getElementsByClassName('app-name')[0].innerText.toLowerCase();
                if (name.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function startVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = currentLang === 'te' ? 'te-IN' : (currentLang === 'hi' ? 'hi-IN' : 'en-IN');
                
                recognition.onresult = function(event) {
                    let spokenText = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = spokenText;
                    filterApps();
                };
                recognition.start();
            } else {
                alert("Voice search is not supported on this browser.");
            }
        }

        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function updateBatteryInfo() {
                    let level = Math.floor(battery.level * 100);
                    let container = document.getElementById('phoneContainer');
                    let batteryText = document.getElementById('batteryText');

                    batteryText.innerText = level + '%';

                    if (level < 20) {
                        container.classList.add('power-saving');
                        document.getElementById('smartAlert').innerText = "Power Saver Active (Battery < 20%)";
                    } else {
                        container.classList.remove('power-saving');
                        document.getElementById('smartAlert').innerText = translations[currentLang].alertNormal;
                    }
                }
                updateBatteryInfo();
                battery.addEventListener('levelchange', updateBatteryInfo);
            });
        }

        // Initialize News on Load
        loadNews();
    </script>
</body>
</html>
